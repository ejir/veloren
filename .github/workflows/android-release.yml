name: Android release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0

    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Validate release tag and calculate Android version code
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::Expected an android-vMAJOR.MINOR.PATCH tag; got ${GITHUB_REF_NAME}."
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"
          if (( 10#$major > 2100 || 10#$minor > 999 || 10#$patch > 999 )); then
            echo "::error::Version components exceed Android's versionCode encoding limits."
            exit 1
          fi
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "::error::Calculated versionCode is outside Android's supported range."
            exit 1
          fi

          echo "ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Building Veloren Android $version (versionCode $version_code)."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate release signing secrets and decode keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?Missing ANDROID_RELEASE_KEYSTORE_BASE64 secret}"
          : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?Missing ANDROID_RELEASE_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?Missing ANDROID_RELEASE_KEY_ALIAS secret}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?Missing ANDROID_RELEASE_KEY_PASSWORD secret}"
          keystore_path="$RUNNER_TEMP/veloren-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          test -s "$keystore_path"
          # Fail fast when the decoded keystore, store password, or alias is
          # wrong instead of surfacing a cryptic error at packaging time.
          # The first output line also reports the keystore type (expect JKS).
          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS"
          # keytool offers no read-only key-password check; re-setting the key
          # password to its current value verifies it without changing anything.
          keytool -keypasswd \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" \
            -keypass "$ANDROID_RELEASE_KEY_PASSWORD" \
            -new "$ANDROID_RELEASE_KEY_PASSWORD"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          # Let sdkmanager's exit status decide the result; `yes` normally ends via SIGPIPE.
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android SDK, CMake, and NDK
        run: >-
          sdkmanager --install
          "platforms;android-35"
          "build-tools;35.0.0"
          "platform-tools"
          "cmake;3.22.1"
          "ndk;28.0.13004108"

      - name: Install pinned Rust toolchain and Android target
        shell: bash
        run: |
          toolchain="$(tr -d '\r\n' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --target aarch64-linux-android
          rustup show active-toolchain

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-release

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: >-
          gradle :app:assembleRelease
          --no-daemon
          --stacktrace
          -PandroidVersionName="$ANDROID_VERSION_NAME"
          -PandroidVersionCode="$ANDROID_VERSION_CODE"

      - name: Verify APK signature and prepare checksums
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          release_apk="android/app/build/outputs/apk/release/veloren-android-${ANDROID_VERSION_NAME}-arm64-v8a.apk"
          test -s "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" "$release_apk"
          sha256sum "$release_apk" > "$release_apk.sha256"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Veloren Android ${{ steps.version.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            android/app/build/outputs/apk/release/veloren-android-${{ steps.version.outputs.name }}-arm64-v8a.apk
            android/app/build/outputs/apk/release/veloren-android-${{ steps.version.outputs.name }}-arm64-v8a.apk.sha256

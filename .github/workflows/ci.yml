name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pinned Rust toolchain with rustfmt
        shell: bash
        run: |
          toolchain="$(tr -d '\r\n' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup component add rustfmt --toolchain "$toolchain"
          rustup show active-toolchain

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      - name: Install pinned Rust toolchain with clippy
        shell: bash
        run: |
          toolchain="$(tr -d '\r\n' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup component add clippy --toolchain "$toolchain"
          rustup show active-toolchain

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy

      - name: Run clippy on the whole workspace
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(tr -d '\r\n' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup show active-toolchain

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-check

      - name: Check the whole workspace
        shell: bash
        run: cargo check --locked --workspace --all-targets
